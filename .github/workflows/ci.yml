name: SQLite report checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas
      - run: python run_analysis.py --output-dir "$RUNNER_TEMP/hr-results"
      - name: Verify the checked-in database
        run: python -c "import sqlite3; db=sqlite3.connect('abc_inc_hr.db'); assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'; assert not db.execute('PRAGMA foreign_key_check').fetchall()"
